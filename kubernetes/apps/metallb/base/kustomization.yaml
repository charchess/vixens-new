# kubernetes/apps/metallb/base/kustomization.yaml
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: metallb-base
namespace: metallb-system

resources:
  - namespace.yaml
  - https://github.com/metallb/metallb/raw/v0.15.2/config/manifests/metallb-native.yaml
  - ipaddresspools.yaml
  - l2advertisement.yaml