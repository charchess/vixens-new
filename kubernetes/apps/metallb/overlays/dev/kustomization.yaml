apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: ipaddresspools.yaml
    target:
      kind: IPAddressPool
  - path: l2advertisement.yaml
    target:
      kind: L2Advertisement

labels:
  - pairs:
      environment: dev
      cluster: vixens-dev
    includeSelectors: true

configMapGenerator:
  - name: metallb-config
    behavior: merge
    literals:
      - environment=dev
      - cluster=vixens-dev