apiVersion: v1
kind: ConfigMap
metadata:
  name: metallb-config
  namespace: metallb-system
data:
  environment: "dev"
  cluster: "vixens-dev"
  config: |
    address-pools:
    - name: default-pool-cluster
      protocol: layer2
      addresses:
      - 192.168.208.240-192.168.208.249
    - name: service-pool-cluster
      protocol: layer2
      addresses:
      - 192.168.208.70-192.168.208.79