# kubernetes/apps/metallb/overlays/dev/l2advertisement.yaml
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool-cluster
    - service-pool-cluster
  nodeSelectors:
    - matchLabels:
        kubernetes.io/os: linux