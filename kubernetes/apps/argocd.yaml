apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:                 # ⬅ on liste à la main
        elements:
          - cluster: in-cluster
            url: https://kubernetes.default.svc
            env: dev        # ⬅ valeur à adapter par cluster
  template:
    metadata:
      name: "argocd-{{.env}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/charchess/vixens-new
        targetRevision: "{{.env}}"
        path: "kubernetes/overlays/argocd/{{.env}}"
      destination:
        server: "{{.url}}"
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true