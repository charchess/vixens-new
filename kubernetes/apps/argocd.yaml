apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  selector:
    matchLabels:
      env: ""
  template:
    metadata:
      name: "argocd-{{.labels.env}}"   # ⬅ clé correcte
    spec:
      project: default
      source:
        repoURL: https://github.com/charchess/vixens-new
        targetRevision: "{{.labels.env}}"
        path: "kubernetes/overlays/argocd/{{.labels.env}}"
      destination:
        server: "{{.server}}"
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true