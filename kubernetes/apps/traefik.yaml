# kubernetes/apps/traefik.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 1) chart Helm officiel
    repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: 37.2.0
    helm:
      releaseName: traefik
      valueFiles:
        - $values/values-base.yaml
        - $values/values-patch.yaml
      # 2) repo contenant les values + patches kustomize
    - repoURL: https://github.com/charchess/vixens-new
      targetRevision: HEAD
      ref: values
    # 3) overlays/dev (Kustomize) appliqué **après** helm
    path: kubernetes/apps/traefik/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true