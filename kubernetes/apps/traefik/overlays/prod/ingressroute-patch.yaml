# kubernetes/apps/traefik/overlays/prod/ingressroute-patch.yaml
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.truxonline.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: local-only
          namespace: traefik
  tls:
    secretName: traefik-dashboard-tls   # géré par cert-manager
