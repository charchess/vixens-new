# kubernetes/apps/traefik/overlays/test/ingressroute-patch.yaml
# kubernetes/apps/traefik/overlays/dev/ingressroute-patch.yaml
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - web          # seulement HTTP
  routes:
    - match: Host(`traefik.dev.local`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: local-only
          namespace: traefik
  tls:              # pas de bloc tls
