# kubernetes/apps/traefik/base/kustomization.yaml
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: traefik-base

namespace: traefik

helmCharts:
  - name: traefik
    repo: https://helm.traefik.io/traefik
    releaseName: traefik
    namespace: traefik
    version: 37.2.0
    valuesFile: values-base.yaml

resources:
  - namespace.yaml
  - ingressroute.yaml
  - middlewares.yaml