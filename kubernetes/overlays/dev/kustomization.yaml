# kubernetes/overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

configMapGenerator:
  - name: env-data
    behavior: merge
    literals:
      - env=dev
      - repo=https://github.com/charchess/vixens-new

vars:
  - name: ENV
    objref:
      kind: ConfigMap
      name: env-data
      apiVersion: v1
    fieldref:
      fieldpath: data.env

resources:
  - ../../base

replacements:
  - source:
      kind: ConfigMap
      name: env-data
      fieldPath: data.env
    targets:
      - select:
          kind: Application
          name: apps
        fieldPaths:
          - spec.source.targetRevision
        options:
          delimiter: '_'
          index: 1
      - select:
          kind: Application
          name: apps
        fieldPaths:
          - spec.source.path
        options:
          delimiter: '_'
          index: 1
